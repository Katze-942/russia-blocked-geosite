name: Build Katze GeoSite
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout runetfreedom/russia-domains-list
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/russia-domains-list
          path: additional

      - name: Checkout runetfreedom/domain-list-custom
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/domain-list-custom
          path: custom

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./custom/go.mod
          cache-dependency-path: ./custom/go.sum

      - name: Prepare selected domain lists
        run: python3 scripts/prepare-data.py categories/geosite-katze.txt community/data additional selected-data

      - name: Build Katze GeoSite
        run: |
          (cd custom && go run ./ --exportlists= --togfwlist= --datapath=../selected-data)
          python3 scripts/select-geodata.py custom/publish/geosite.dat publish/geosite.dat --categories categories/geosite-katze.txt
          cp categories/geosite-katze.txt publish/
          printf 'Workflow commit: %s\nGenerator commit: %s\nCommunity commit: %s\nAdditional lists commit: %s\n' \
            "$GITHUB_SHA" "$(git -C custom rev-parse HEAD)" "$(git -C community rev-parse HEAD)" \
            "$(git -C additional rev-parse HEAD)" > publish/KATZE_GEODATA_SOURCE
          sha256sum categories/geosite-katze.txt >> publish/KATZE_GEODATA_SOURCE
          (cd publish && sha256sum geosite.dat > geosite.dat.sha256sum && sha256sum --check --strict geosite.dat.sha256sum)

      - name: Set release name
        run: |
          echo "RELEASE_NAME=Released on $(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Release and upload assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to "release" branch
        run: |
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
